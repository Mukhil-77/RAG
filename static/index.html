<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>StudyRAG</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg1: #fbf6ee;
        --bg2: #f3ece0;
        --card: #fff;
        --ink: #1d1a17;
        --mut: #6f6a63;
        --line: #ece6dc;
        --soft: #f6f2ea;
        --dark: #1d1a17;
        --pri: #b5501f;
        --teal: #1f7f8e;
        --olive: #6a8f1f;
        --amber: #d9971b;
        --blue: #3d6fd8;
        --bad: #c9403a;
        --ok: #2f8a57;
        color-scheme: light;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      :root[data-theme="dark"] {
        --bg1: #121110;
        --bg2: #171513;
        --card: #1d1b19;
        --ink: #f3eee8;
        --mut: #a39c93;
        --line: #2b2825;
        --soft: #262320;
        --dark: #f3eee8;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-theme="dark"]) {
          --bg1: #121110;
          --bg2: #171513;
          --card: #1d1b19;
          --ink: #f3eee8;
          --mut: #a39c93;
          --line: #2b2825;
          --soft: #262320;
          --dark: #f3eee8;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100%;
        font:
          400 14.5px/1.5 Outfit,
          system-ui,
          sans-serif;
        color: var(--ink);
        background: linear-gradient(135deg, var(--bg1), var(--bg2)) fixed;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
      }
      input {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 14px;
        width: 100%;
        outline: 0;
        transition: 0.2s;
      }
      input:focus {
        border-color: var(--pri);
      }
      :focus-visible {
        outline: 2px solid var(--pri);
        outline-offset: 2px;
      }
      .app {
        max-width: 1520px;
        margin: 0 auto;
        padding: 14px 18px 40px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        border-radius: 26px;
        padding: 9px 14px;
        position: sticky;
        top: 8px;
        z-index: 15;
        box-shadow: 0 8px 24px -20px #000;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 11px;
        cursor: pointer;
      }
      .logo i {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 30% 25%,
          color-mix(in srgb, var(--pri) 70%, #fff),
          var(--pri)
        );
        display: grid;
        place-items: center;
        color: #fff;
        font-style: normal;
        font-size: 20px;
      }
      .logo b {
        font-size: 20px;
        font-weight: 500;
        display: block;
        line-height: 1;
      }
      .logo small {
        color: var(--mut);
        font-size: 12px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 4px;
        margin: 0 auto 0 20px;
        overflow: auto;
      }
      .tabs button {
        padding: 8px 16px;
        border-radius: 22px;
        color: var(--mut);
        transition: 0.25s;
        white-space: nowrap;
      }
      .tabs button.on {
        background: var(--dark);
        color: var(--card);
      }
      .sp {
        flex: 1;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 10px 16px;
        color: var(--mut);
        min-width: 190px;
        cursor: pointer;
      }
      kbd {
        margin-left: auto;
        font: inherit;
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 1px 6px;
        background: var(--soft);
      }
      .ib {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        position: relative;
        flex: none;
      }
      .ib:hover {
        background: var(--soft);
      }
      .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: var(--bad);
        color: #fff;
        font-size: 11px;
        border-radius: 10px;
        min-width: 18px;
        height: 18px;
        display: none;
        place-items: center;
      }
      .btn {
        background: var(--pri);
        color: #fff;
        border-radius: 24px;
        padding: 10px 18px;
        font-weight: 500;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      .btn:hover {
        filter: brightness(0.92);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn:disabled {
        opacity: 0.55;
        pointer-events: none;
      }
      .btn.g {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.k {
        background: var(--dark);
        color: var(--card);
      }
      .btn.s {
        padding: 6px 12px;
        font-size: 13px;
      }
      .me {
        display: flex;
        align-items: center;
        gap: 9px;
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 4px 12px 4px 4px;
      }
      .av {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12.5px;
        font-weight: 500;
        flex: none;
        background: color-mix(in srgb, var(--pri) 18%, var(--card));
        color: var(--pri);
      }
      .me small {
        display: block;
        font-size: 11px;
        color: var(--mut);
        line-height: 1.1;
      }
      .main {
        display: flex;
        gap: 16px;
        margin-top: 16px;
      }
      .side {
        width: 84px;
        flex: none;
        position: sticky;
        top: 84px;
        align-self: flex-start;
      }
      .rail {
        background: var(--card);
        border-radius: 28px;
        padding: 7px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center;
      }
      .rail button {
        width: 58px;
        height: 58px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        position: relative;
        color: var(--mut);
        transition: 0.25s;
      }
      .rail button:hover {
        background: var(--soft);
        color: var(--ink);
      }
      .rail button.on {
        background: var(--pri);
        color: #fff;
        box-shadow: 0 8px 18px -8px var(--pri);
      }
      .rail .th2 {
        display: flex;
        gap: 4px;
        background: var(--soft);
        border-radius: 30px;
        padding: 3px;
        margin-top: 6px;
      }
      .rail .th2 button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
      }
      .rail .th2 button.on {
        background: var(--dark);
        color: var(--card);
        box-shadow: none;
      }
      svg.i {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .content {
        flex: 1;
        min-width: 0;
      }
      .view {
        animation: in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      .sub {
        color: var(--mut);
      }
      h1 {
        font-size: 44px;
        font-weight: 400;
        letter-spacing: -1.4px;
        margin: 2px 0 0;
        line-height: 1.1;
      }
      .head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin: 6px 4px 18px;
      }
      .head .a {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .g4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .af {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      .cols {
        display: grid;
        grid-template-columns: 1.9fr 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      .cols2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      .mt {
        margin-top: 16px;
      }
      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .ch {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 14px;
      }
      .ch h3 {
        font-size: 16px;
        font-weight: 500;
        margin: 0;
      }
      .ch small {
        color: var(--mut);
        display: block;
        margin-top: 2px;
      }
      .kpi {
        padding: 16px 18px;
      }
      .kpi .l {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--mut);
      }
      .kpi .ic,
      .ico {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--c, var(--pri)) 16%, var(--card));
        color: var(--c, var(--pri));
        flex: none;
      }
      .kpi .v {
        font-size: 30px;
        font-weight: 500;
        margin-top: 10px;
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .kpi .v small {
        font-size: 14px;
        color: var(--mut);
        font-weight: 400;
      }
      .pill {
        font-size: 12px;
        border-radius: 12px;
        padding: 3px 10px;
        background: var(--soft);
        color: var(--mut);
        display: inline-flex;
        gap: 5px;
        align-items: center;
        white-space: nowrap;
      }
      .pill.r {
        background: color-mix(in srgb, var(--bad) 14%, var(--card));
        color: var(--bad);
      }
      .pill.y {
        background: color-mix(in srgb, var(--amber) 18%, var(--card));
        color: #a8730a;
      }
      .pill.g {
        background: color-mix(in srgb, var(--ok) 15%, var(--card));
        color: var(--ok);
      }
      .pill.c {
        background: color-mix(in srgb, var(--pri) 15%, var(--card));
        color: var(--pri);
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 16px 0;
      }
      .chip {
        background: var(--card);
        border-radius: 22px;
        padding: 8px 16px;
        transition: 0.2s;
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .chip:hover {
        background: var(--soft);
      }
      .chip.on {
        background: var(--dark);
        color: var(--card);
      }
      .chip span {
        opacity: 0.6;
        font-size: 12.5px;
      }
      .tbl {
        background: var(--card);
        border-radius: 24px;
        padding: 8px 18px 12px;
        overflow-x: auto;
      }
      .tr {
        display: grid;
        grid-template-columns: var(--t);
        gap: 14px;
        align-items: center;
        padding: 11px 0;
        border-top: 1px solid var(--line);
        min-width: 640px;
      }
      .tr.h {
        border: 0;
        color: var(--mut);
        font-size: 12.5px;
        padding: 12px 0 6px;
      }
      .tr:not(.h):hover {
        background: var(--soft);
        box-shadow:
          -10px 0 0 var(--soft),
          10px 0 0 var(--soft);
      }
      .tr small {
        color: var(--mut);
        display: block;
        font-size: 12.5px;
      }
      .b5 {
        font-weight: 500;
      }
      .th {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c));
        flex: none;
      }
      .fl {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .fl > div:last-child {
        min-width: 0;
      }
      .bar {
        height: 5px;
        background: var(--soft);
        border-radius: 4px;
        margin-top: 5px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 4px;
        background: var(--c, var(--pri));
        transition: width 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .pc {
        cursor: pointer;
        transition: 0.3s;
      }
      .pc:hover {
        transform: translateY(-3px);
        box-shadow: 0 16px 30px -20px #0006;
      }
      .pc.sel {
        outline: 2px solid var(--pri);
      }
      .hero {
        display: grid;
        grid-template-columns: 1.15fr 1fr 1fr 1fr;
        gap: 16px;
      }
      .hero h2 {
        font-size: 46px;
        font-weight: 400;
        letter-spacing: -1.5px;
        margin: 8px 0;
        line-height: 1.05;
      }
      .live {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        background: var(--card);
        border-radius: 20px;
        padding: 5px 12px;
        font-size: 12.5px;
        color: var(--mut);
      }
      .live i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        animation: pu 1.8s infinite;
      }
      @keyframes pu {
        50% {
          box-shadow: 0 0 0 6px #2f8a5722;
        }
      }
      .gauge {
        display: grid;
        place-items: center;
        position: relative;
      }
      .gauge .c {
        position: absolute;
        bottom: 22px;
        text-align: center;
      }
      .gauge b {
        font-size: 38px;
        font-weight: 500;
      }
      .fade {
        animation: fd 1.2s backwards;
      }
      @keyframes fd {
        from {
          opacity: 0;
        }
      }
      .draw {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: dr 2s ease forwards;
      }
      @keyframes dr {
        to {
          stroke-dashoffset: 0;
        }
      }
      .li {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--soft);
        margin-bottom: 8px;
        transition: 0.2s;
      }
      .li:hover {
        transform: translateX(3px);
      }
      .li > div:not(.ico) {
        flex: 1;
        min-width: 0;
      }
      .li small {
        color: var(--mut);
        display: block;
      }
      .empty {
        color: var(--mut);
        padding: 22px;
        text-align: center;
      }
      .seg {
        display: inline-flex;
        background: var(--soft);
        border-radius: 20px;
        padding: 3px;
        flex-wrap: wrap;
      }
      .seg button {
        padding: 7px 16px;
        border-radius: 16px;
        color: var(--mut);
      }
      .seg .on {
        background: var(--card);
        color: var(--ink);
      }
      .drop {
        border: 2px dashed var(--line);
        border-radius: 24px;
        padding: 30px;
        text-align: center;
        color: var(--mut);
        cursor: pointer;
        background: color-mix(in srgb, var(--card) 60%, transparent);
        transition: 0.25s;
      }
      .drop:hover,
      .drop.over {
        border-color: var(--pri);
        background: var(--card);
      }
      .drop b {
        display: block;
        color: var(--ink);
        font-weight: 500;
        font-size: 18px;
        margin: 8px 0 2px;
      }
      .ind {
        height: 4px;
        border-radius: 3px;
        background: var(--line);
        margin: 14px auto 0;
        max-width: 240px;
        overflow: hidden;
      }
      .ind i {
        display: block;
        height: 100%;
        width: 40%;
        background: var(--pri);
        border-radius: 3px;
        animation: sl 1s infinite ease-in-out;
      }
      @keyframes sl {
        from {
          margin-left: -40%;
        }
        to {
          margin-left: 100%;
        }
      }
      .chatw {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 16px;
        align-items: start;
      }
      .chat {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 250px);
        min-height: 460px;
        padding: 0;
      }
      .log {
        flex: 1;
        overflow: auto;
        padding: 22px 22px 8px;
      }
      .m {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        max-width: 820px;
      }
      .m.u {
        flex-direction: row-reverse;
        margin-left: auto;
      }
      .m .bb {
        min-width: 0;
      }
      .m.u .bb {
        background: var(--dark);
        color: var(--card);
        padding: 10px 16px;
        border-radius: 20px 20px 4px 20px;
      }
      .m.b .bb {
        background: var(--soft);
        padding: 14px 18px;
        border-radius: 20px 20px 20px 4px;
        line-height: 1.65;
      }
      .bb p {
        margin: 0 0 9px;
      }
      .bb p:last-child {
        margin: 0;
      }
      .bb ul,
      .bb ol {
        padding-left: 22px;
        margin: 0 0 9px;
      }
      .bb h4 {
        margin: 10px 0 6px;
        font-weight: 500;
        font-size: 15px;
      }
      .cc {
        font: 600 11px Outfit;
        background: var(--pri);
        color: #fff;
        border-radius: 8px;
        padding: 1px 7px;
        margin: 0 1px;
        cursor: pointer;
        vertical-align: 1px;
      }
      .cc:hover {
        filter: brightness(0.9);
      }
      .acts {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        align-items: center;
      }
      .dots {
        display: inline-flex;
        gap: 4px;
      }
      .dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--mut);
        animation: bn 1.1s infinite;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bn {
        40% {
          transform: translateY(-5px);
        }
      }
      .comp {
        margin: 8px 18px 18px;
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 6px 6px 6px 18px;
      }
      .comp input {
        border: 0;
        background: none;
        padding: 8px 0;
      }
      .scope {
        padding: 0 22px 8px;
      }
      .sg {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 14px;
      }
      .src {
        border-radius: 14px;
        background: var(--soft);
        padding: 11px 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: 0.2s;
      }
      .src:hover {
        transform: translateX(3px);
      }
      .src.hl {
        outline: 2px solid var(--pri);
      }
      .src p {
        margin: 6px 0 0;
        color: var(--mut);
        font-size: 13px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .fc {
        perspective: 900px;
        height: 170px;
        cursor: pointer;
      }
      .fi {
        position: relative;
        height: 100%;
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-style: preserve-3d;
      }
      .fc.on .fi {
        transform: rotateY(180deg);
      }
      .fc .f {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        border-radius: 20px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: auto;
        background: var(--soft);
      }
      .fc .f.k {
        transform: rotateY(180deg);
        background: var(--dark);
        color: var(--card);
      }
      .out {
        line-height: 1.7;
      }
      .shade {
        position: fixed;
        inset: 0;
        background: #0a0a0a66;
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        z-index: 30;
      }
      .shade.on {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;

          .replace(/\$\$([\s\S]+?)\$\$/g, (_, x) => keep(x, 1))
          .replace(/\\\[([\s\S]+?)\\\]/g, (_, x) => keep(x, 1))
          .replace(/\\\(([\s\S]+?)\\\)/g, (_, x) => keep(x, 0))
          .replace(/\$(?!\s)([^$\n]+?)(?<!\s)\$/g, (_, x) => keep(x, 0));
        let h = esc(s)
            .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")

          o = "",
          ul = 0;
        const L = h.split("\n"),
          bare = (n) => (l) =>
            nsrc
              ? l.replace(/([^\s=+\-*\/^<>(,|])\s+(\d{1,2})(\s*\|?\s*)$/, (m, p, d, e) =>
                  +d >= 1 && +d <= nsrc
                    ? `${p} <button class="cc" data-c="${d}">${d}</button>${e}`
                    : m,
                )
              : l;
        const fixl = bare();
        for (let i = 0; i < L.length; i++) {
          const l = fixl(L[i]);
          if (/^\s*\|/.test(l) && /^\s*\|?\s*:?-{2,}/.test(L[i + 1] || "")) {
            if (ul) {
              o += "</" + ul + ">";
              ul = 0;
            }
            const cl = (r) =>
                fixl(r)
                  .trim()
                  .replace(/^\||\|\s*$/g, "")
                  .split("|")
                  .map((c) => c.trim()),
              hd = cl(L[i]);
            i += 2;
            const rows = [];
            while (i < L.length && /^\s*\|/.test(L[i])) rows.push(cl(L[i++]));
            i--;
            o += `<div class="tw"><table><thead><tr>${hd.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
            continue;
          }
          const li = l.match(/^\s*(?:([-*•])|(\d+)\.) (.*)/);
          if (li) {
            const ty = li[2] ? "ol" : "ul";
            if (ul && ul != ty) {
              o += "</" + ul + ">";
              ul = 0;
            }
            if (!ul) {
              o += ty == "ol" ? `<ol start="${li[2]}">` : "<ul>";
              ul = ty;

            o += "<li>" + li[3] + "</li>";

          dk = t === "dark" || (!t && matchMedia("(prefers-color-scheme:dark)").matches);
        $("#tabs").innerHTML = NAV.map(
          (n) => `<button data-v="${n[0]}" class="${S.view == n[0] ? "on" : ""}">${n[1]}</button>`,
        ).join("");
        $("#rail").innerHTML =
          NAV.map(
            (n) =>
              `<button data-v="${n[0]}" class="${S.view == n[0] ? "on" : ""}" aria-label="${n[1]}" title="${n[1]}">${ic(n[2])}</button>`,
          ).join("") +
          `<div class="th2"><button class="${dk ? "" : "on"}" data-th="light" aria-label="Light theme">${ic("sun")}</button><button class="${dk ? "on" : ""}" data-th="dark" aria-label="Dark theme">${ic("moon")}</button></div>`;
        $("#bi").innerHTML = ic("bell");
        $("#si").innerHTML = ic("search", 16);
        const h = new Date().getHours();
        $("#hi").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      }
      function paint() {
        $("#view").innerHTML = `<div class="view">${V[S.view]()}</div>`;
        requestAnimationFrame(() => {
          $$("[data-w]").forEach((e) => (e.style.width = e.dataset.w + "%"));
          $$("[data-n]").forEach((e) => {
            const t = +e.dataset.n,
              t0 = performance.now();
            (function f(n) {
              const k = Math.min(1, (n - t0) / 900);
              e.textContent = Math.round(t * (1 - Math.pow(1 - k, 3))).toLocaleString();
              if (k < 1) requestAnimationFrame(f);
            })(t0);
          });
        });
        const n = (S.mon?.agent.alerts || []).filter((a) => a.severity !== "info").length,
          b = $("#badge");
        b.style.display = n ? "grid" : "none";
        b.textContent = n;
        if (S.view == "chat") {
          const l = $("#log");
          l.scrollTop = l.scrollHeight;
        }
      }
      function go(v) {
        S.view = v;
        chrome();
        paint();
        scrollTo({ top: 0, behavior: "smooth" });
      }
      const openD = (h) => {
          $("#drawer").innerHTML = h;
          $("#drawer").classList.add("on");
          $("#shade").classList.add("on");
        },
        closeD = () => {
          $("#drawer").classList.remove("on");
          $("#shade").classList.remove("on");
          $("#pal").classList.remove("on");
        };
      $("#shade").onclick = closeD;
      function srcDrawer(n) {
        const s = S.src.find((x) => x.n == n);
        if (!s) return;
        S.hl = n;
        if ($("#srcs")) $("#srcs").innerHTML = srcHtml();
        openD(
          `<div class="ch"><div><h3>Source [${s.n}]</h3><small>${esc(s.doc)} · page ${s.page}</small></div><button class="ib" data-a="close" aria-label="Close">${ic("x")}</button></div><div class="dbody"><div class="tile" style="margin-bottom:14px"><small>Retrieval match</small><b>${Math.round(s.score * 100)}%</b>${bar(s.score * 100, col(s.score + 0.3))}</div><div class="bb out" style="background:var(--soft);padding:16px;border-radius:16px">${esc(s.text)}…</div></div>`,
        );
        requestAnimationFrame(() =>
          $$("#drawer [data-w]").forEach((e) => (e.style.width = e.dataset.w + "%")),
        );
      }
      function docDrawer(id) {
        const d = S.docs.find((x) => x.id == id);
        if (!d) return;
        const e = ext(d.name),
          on = S.sel.has(id);
        openD(
          `<div class="ch"><div class="fl"><div class="th" style="--c:${COL[e] || "#b5501f"}">${e}</div><div><h3>${esc(d.name)}</h3><small>Added ${d.added.slice(0, 10)}</small></div></div><button class="ib" data-a="close" aria-label="Close">${ic("x")}</button></div><div class="dbody"><div class="grid" style="grid-template-columns:1fr 1fr"><div class="tile"><small>Passages</small><b>${d.chunks}</b></div><div class="tile"><small>Format</small><b>${e}</b></div></div><p class="sub" style="margin-top:16px">${on ? "This document is in your chat scope." : "Add it to your scope to ask questions about just this file."}</p></div><div class="dfoot"><button class="btn ${on ? "k" : ""}" data-sel="${id}" style="flex:1;justify-content:center">${on ? "✓ In scope" : "Use in chat"}</button><button class="btn g" data-del="${id}" aria-label="Delete">${ic("trash", 16)}</button></div>`,
        );
      }
      let pf = 0;
      const items = () => {
        const q = $("#pin").value.toLowerCase();
        return [
          ["Go to", NAV.map((n) => [n[1], n[2], () => go(n[0])])],
          [
            "Actions",
            [
              ["Upload documents", "up", () => $("#file").click()],
              [
                "Run agent now",
                "pulse",
                () => {
                  go("monitor");
                  runAgent();
                },
              ],
              [
                "Toggle theme",
                "sun",
                () => {
                  const r = document.documentElement;
                  r.dataset.theme = r.dataset.theme == "dark" ? "light" : "dark";
                  chrome();
                },
              ],
            ],
          ],
          [
            "Documents",
            S.docs.map((d) => [
              d.name,
              "doc",
              () => {
                go("library");
                docDrawer(d.id);
              },
            ]),
          ],
        ]
          .map(([t, a]) => [t, a.filter((x) => x[0].toLowerCase().includes(q))])
          .filter((x) => x[1].length);
      };
      function palR() {
        let i = 0;
        $("#prs").innerHTML =
          items()
            .map(
              ([t, a]) =>
                `<b>${t}</b>` +
                a
                  .map(
                    (x) =>
                      `<button class="${i++ == pf ? "f" : ""}" data-pi="${i - 1}"><span class="ico">${ic(x[1], 16)}</span>${esc(x[0])}</button>`,
                  )
                  .join(""),
            )
            .join("") || '<div class="empty">Nothing matches.</div>';
      }
      function pal(o) {
        $("#pal").classList.toggle("on", !!o);
        $("#shade").classList.toggle("on", !!o);
        if (o) {
          $("#pin").value = "";
          pf = 0;
          palR();
          $("#pin").focus();
        }
      }
      const flat = () => items().flatMap((x) => x[1]);
      $("#pin").oninput = () => {
        pf = 0;
        palR();
      };
      $("#pin").onkeydown = (e) => {
        const n = flat().length || 1;
        if (e.key == "ArrowDown") {
          pf = (pf + 1) % n;
          palR();
          e.preventDefault();
        }
        if (e.key == "ArrowUp") {
          pf = (pf + n - 1) % n;
          palR();
          e.preventDefault();
        }
        if (e.key == "Enter") {
          const f = flat()[pf];
          pal(0);
          f && f[2]();
        }
      };
      document.addEventListener("keydown", (e) => {
        if (T.i >= 0) {
          if (e.key == "Escape") tourEnd();
          if (e.key == "ArrowRight") {
            TOUR[T.i + 1] ? (T.i++, tourShow()) : tourEnd(1);
          }
          if (e.key == "ArrowLeft" && T.i) {
            T.i--;
            tourShow();
          }
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key == "k") {
          e.preventDefault();
          pal(1);
        }
        if (e.key == "Escape") closeD();
        if (e.target.id == "drop" && e.key == "Enter") $("#file").click();
      });
      async function exportPdf() {
        if (!S.msgs.length) return toast("Ask something first, then export");
        if (!window.html2pdf)
          return toast("PDF library could not load. Check your internet connection.");
        const body = S.msgs
          .map((m) =>
            m.r == "u"
              ? `<div class="u"><b>You</b><p>${esc(m.t)}</p></div>`
              : `<div class="a"><b>StudyRAG</b>${m.err ? `<p>${esc(m.t)}</p>` : md(m.t, (m.src || []).length)}${(m.src || []).length ? `<div class="s">Sources: ${m.src.map((x) => `[${x.n}] ${esc(x.doc)}, p.${x.page}`).join(" &middot; ")}</div>` : ""}</div>`,
          )
          .join("");
        const el = document.createElement("div");
        el.className = "pdfdoc";
        el.innerHTML = `<style>.pdfdoc{width:700px;background:#fff;color:#1d1a17;font:13px/1.6 Arial,sans-serif}.pdfdoc h1{font-size:21px;margin:0 0 2px}.pdfdoc .meta{color:#6f6a63;margin-bottom:14px}.pdfdoc .u,.pdfdoc .a{margin:0 0 12px;padding:10px 14px;border-radius:10px}.pdfdoc .u{background:#f1ece3}.pdfdoc .a{border:1px solid #e5ded2}.pdfdoc p{margin:4px 0}.pdfdoc ul,.pdfdoc ol{margin:4px 0;padding-left:22px}.pdfdoc h4{margin:8px 0 2px;font-size:14px}.pdfdoc .cc{font:600 9px Arial;background:#b5501f;color:#fff;border:0;border-radius:6px;padding:0 5px}.pdfdoc .s{font-size:11px;color:#6f6a63;margin-top:6px;border-top:1px solid #eee;padding-top:4px}.pdfdoc .tw table{background:#fff;font-size:12px;width:100%;border-collapse:collapse}.pdfdoc .tw th{background:#f1ece3}.pdfdoc .tw th,.pdfdoc .tw td{border:1px solid #d9d2c5;padding:6px 10px;color:#1d1a17;background-clip:padding-box}.pdfdoc .katex-display{margin:.5em 0;overflow:visible}</style><h1>StudyRAG conversation</h1><div class="meta">${new Date().toLocaleString()} &middot; ${esc(scopeTxt())}</div>${body}`;
        toast("Preparing your PDF…");
        try {
          await document.fonts.ready;
          await html2pdf()
            .set({
              margin: [12, 10, 14, 10],
              filename: "StudyRAG-chat-" + new Date().toISOString().slice(0, 10) + ".pdf",
              image: { type: "jpeg", quality: 0.96 },
              html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
              jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
              pagebreak: { mode: ["css", "legacy"], avoid: [".u", "tr", ".katex-display"] },
            })
            .from(el)
            .save();
          toast("PDF downloaded");
        } catch (x) {
          toast("Could not create PDF: " + x.message);
        }
      }
      const TOUR = [
        {
          v: "overview",
          t: "Welcome to StudyRAG",
          x: "Chat with your own documents and get answers with citations. This short tour shows you around. You can skip it at any time.",
        },
        {
          v: "library",
          s: "#drop",
          t: "1. Upload your documents",
          x: "Drop PDF, DOCX, TXT or Markdown files here, or click to browse. Each file is split into searchable passages.",
        },
        {
          v: "library",
          s: ".chips",
          t: "2. Organise and choose scope",
          x: "Filter by file type and switch between List and Grid. Open a document and press “Use in chat” to ask questions about only that file.",
        },
        {
          v: "chat",
          s: ".comp",
          t: "3. Ask questions",
          x: "Type any question about your files. Follow-up questions work too, and formulas and tables are shown properly.",
        },
        {
          v: "chat",
          s: "#srcs",
          t: "4. Check the sources",
          x: "Every answer cites passages like [1]. Click a number to read the exact source text.",
        },
        {
          v: "chat",
          s: "[data-a=pdf]",
          t: "5. Export to PDF",
          x: "Download the whole conversation, with formulas and sources, as a PDF file.",
        },
        {
          v: "study",
          s: ".seg",
          t: "6. Study tools",
          x: "Turn your material into a summary, a quiz or flashcards. Add a topic to focus them.",
        },
        {
          v: "monitor",
          s: "#agentinfo",
          t: "7. The monitoring agent",
          x: "The agent is a built-in quality inspector. It tests search, scores your answers and raises alerts with suggested fixes, automatically every 5 minutes.",
        },
        {
          v: "monitor",
          s: "[data-a=run]",
          t: "8. Run the agent yourself",
          x: "Press this for a full check. A progress bar at the bottom of the screen shows the percentage and the current step.",
        },
        {
          v: "guide",
          s: ".gl",
          t: "9. Documentation",
          x: "Read the full guide here any time, download it as a PDF, or replay this tutorial with the Start tutorial button.",
        },
      ];
      const T = { i: -1 };
      function tourEnd(done) {
        T.i = -1;
        $("#tour").classList.remove("on");
        try {
          localStorage.setItem("srag_tour", "1");
        } catch {}
        if (done) toast("Tutorial finished. Replay it from the Guide tab.");
      }
      async function tourShow() {
        if (T.i < 0) return;
        const st = TOUR[T.i],
          sw = S.view != st.v;
        if (sw) {
          S.view = st.v;
          chrome();
          paint();
        }
        $("#tour").classList.add("on");
        await sleep(sw ? 600 : 80);
        if (T.i < 0) return;
        const el = st.s ? $(st.s) : null,
          tip = $("#ttip"),
          sp = $("#tspot"),
          last = T.i == TOUR.length - 1;
        $("#tour").classList.toggle("dim", !el);
        tip.innerHTML = `<div class="sub" style="font-size:12.5px;margin-bottom:4px">Step ${T.i + 1} of ${TOUR.length}</div><h3>${esc(st.t)}</h3><p>${esc(st.x)}</p><div class="bar" style="margin:0"><i style="width:${((T.i + 1) / TOUR.length) * 100}%"></i></div><div class="tb"><button class="btn g s" data-a="tskip">Skip tutorial</button><span class="sp"></span>${T.i ? '<button class="btn g s" data-a="tback">Back</button>' : ""}<button class="btn s" data-a="tnext">${T.i == 0 ? "Start tutorial" : last ? "Finish" : "Next"}</button></div>`;
        requestAnimationFrame(() => {
          const b = tip.querySelector(".bar i");
          if (b) b.style.width = ((T.i + 1) / TOUR.length) * 100 + "%";
        });
        const W = innerWidth,
          Hh = innerHeight,
          tw = tip.offsetWidth,
          th = tip.offsetHeight;
        let x = (W - tw) / 2,
          y = (Hh - th) / 2;
        if (el) {
          el.scrollIntoView({ block: "center" });
          await sleep(120);
          const r = el.getBoundingClientRect(),
            p = 8;
          Object.assign(sp.style, {
            left: r.left - p + "px",
            top: r.top - p + "px",
            width: r.width + 2 * p + "px",
            height: r.height + 2 * p + "px",
          });
          y =
            r.bottom + p + 14 + th < Hh
              ? r.bottom + p + 14
              : r.top - p - 14 - th > 8
                ? r.top - p - 14 - th
                : Math.max(8, Hh - th - 12);
          x = Math.min(Math.max(12, r.left), W - tw - 12);
        }
        tip.style.left = x + "px";
        tip.style.top = y + "px";
      }
      const tourStart = () => {
        closeD();
        T.i = 0;
        tourShow();
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      function pgSet(p, t, done) {
        $("#pgp").textContent = p + "%";
        $("#pgs").textContent = t || "";
        $("#pgb").style.width = p + "%";
        $("#pgc").style.setProperty("--c", done ? "var(--ok)" : "var(--pri)");
        $("#pgt").textContent = done ? "✓ Agent run complete" : "Agent is running";
      }
      async function trackAgent() {
        if (S.run) return;
        S.run = true;
        if (S.view == "monitor") paint();
        pgSet(0, "Starting…");
        $("#pg").classList.add("on");
        try {
          for (;;) {
            const p = await api("/api/monitor/progress");
            pgSet(p.pct, p.step, !p.running && !p.error);
            if (!p.running) {
              if (p.error) toast("Agent failed: " + p.error);
              else {
                await sleep(1400);
                toast("Agent run complete");
              }
              break;
            }
            await sleep(600);
          }
        } catch (x) {
          toast(x.message);
        }
        S.run = false;
        $("#pg").classList.remove("on");
        await load();
        if (S.view == "monitor") paint();
      }
      async function runAgent() {
        if (S.run) return;
        try {
          await api("/api/monitor/run", { method: "POST" });
        } catch (x) {
          return toast(x.message);
        }
        trackAgent();
      }
      async function ask(q) {
        if (!q || S.busy) return;
        if (S.view != "chat") go("chat");
        S.busy = true;
        S.msgs.push({ r: "u", t: q });
        paint();
        const l = $("#log");
        l.insertAdjacentHTML(
          "beforeend",
          '<div class="m b"><div class="av" style="background:var(--pri);color:#fff">◆</div><div class="bb"><span class="dots"><i></i><i></i><i></i></span></div></div>',
        );
        l.scrollTop = l.scrollHeight;
        try {
          const r = await post("/api/chat", { question: q, history: S.hist, doc_ids: [...S.sel] });
          S.hist.push({ role: "user", content: q }, { role: "assistant", content: r.answer });
          S.msgs.push({ r: "b", t: r.answer, n: r.sources.length, src: r.sources });
          S.src = r.sources;
          S.hl = 0;
        } catch (x) {
          S.msgs.push({ r: "b", t: x.message, err: 1 });
        }
        S.busy = false;
        if (S.view == "chat") paint();
      }
      async function upload(files) {
        if (!files.length) return;
        const fd = new FormData();
        [...files].forEach((f) => fd.append("files", f));
        S.up = true;
        go("library");
        try {
          await api("/api/upload", { method: "POST", body: fd });
          toast("Upload complete");
        } catch (e) {
          toast(e.message);
        }
        S.up = false;
        $("#file").value = "";
        await load();
      }
      document.addEventListener("click", async (e) => {
        const t = e.target.closest("button,[data-open],[data-fc]");
        if (!t) return;
        const d = t.dataset;
        if (d.v) go(d.v);
        if (d.th) {
          document.documentElement.dataset.theme = d.th;
          chrome();
        }
        if (d.pi != null) {
          pf = +d.pi;
          const f = flat()[pf];
          pal(0);
          f && f[2]();
        }
        if (d.sel) {
          S.sel.has(d.sel) ? S.sel.delete(d.sel) : S.sel.add(d.sel);
          closeD();
          paint();
          return;
        }
        if (d.del) {
          if (confirm("Delete this document?")) {
            await api("/api/docs/" + d.del, { method: "DELETE" });
            S.sel.delete(d.del);
            closeD();
            toast("Document deleted");
            load();
          }
          return;
        }
        if (d.open) {
          docDrawer(d.open);
          return;
        }
        if (d.lv) {
          S.lv = d.lv;
          paint();
        }
        if (d.k) {
          S.kind = d.k;
          paint();
        }
        if (d.m) {
          S.mode = d.m;
          S.gen = null;
          paint();
        }
        if (d.q) ask(d.q);
        if (d.c) srcDrawer(d.c);
        if (d.fc != null) t.classList.toggle("on");
        if (d.copy != null) {
          navigator.clipboard?.writeText(S.msgs[d.copy].t);
          toast("Copied");
        }
        const a = d.a;
        if (a == "close") closeD();
        if (a == "clrsel") {
          S.sel.clear();
          paint();
        }
        if (a == "clr") {
          S.msgs = [];
          S.hist = [];
          S.src = [];
          paint();
        }
        if (a == "key") {
          $("#key").style.display = "block";
          t.remove();
        }
        if (a == "pdf") exportPdf();
        if (a == "tour") tourStart();
        if (a == "tskip") tourEnd();
        if (a == "tback") {
          T.i--;
          tourShow();
        }
        if (a == "tnext") {
          if (T.i >= TOUR.length - 1) tourEnd(1);
          else {
            T.i++;
            tourShow();
          }
        }
        if (d.g) $("#g-" + d.g)?.scrollIntoView({ behavior: "smooth", block: "start" });
        if (a == "run") runAgent();
        if (a == "reidx" && confirm("Re-embed every passage? This can take a while.")) {
          try {
            await api("/api/monitor/reindex", { method: "POST" });
            toast("Index rebuilt");
          } catch (x) {
            toast(x.message);
          }
          load();
        }
        if (a == "gen") {
          S.topic = $("#topic").value;
          S.busy = true;
          S.gen = null;
          paint();
          try {
            const r = await post("/api/study", {
              mode: S.mode,
              topic: S.topic,
              doc_ids: [...S.sel],
            });
            S.gen = { mode: S.mode, text: r.result };
          } catch (x) {
            S.gen = { err: x.message };
          }
          S.busy = false;
          if (S.view == "study") paint();
        }
      });
      document.addEventListener("submit", (e) => {
        if (e.target.id == "ask") {
          e.preventDefault();
          const q = $("#q").value.trim();
          $("#q").value = "";
          ask(q);
        }
      });
      document.addEventListener("click", (e) => {
        if (e.target.closest("#drop")) $("#file").click();
      });
      ["dragover", "dragleave", "drop"].forEach((ev) =>
        document.addEventListener(ev, (e) => {
          const d = e.target.closest?.("#drop");
          if (!d) return;
          e.preventDefault();
          d.classList.toggle("over", ev == "dragover");
          if (ev == "drop") upload(e.dataTransfer.files);
        }),
      );
      $("#file").onchange = (e) => upload(e.target.files);
      async function load() {
        try {
          [S.docs, S.mon] = await Promise.all([api("/api/docs"), api("/api/monitor")]);
        } catch {}
        if (
          !["chat", "study"].includes(S.view) &&
          !$("#pal").classList.contains("on") &&
          !$("#drawer").classList.contains("on")
        )
          paint();
        else if (S.view == "chat" && $("#scp")) $("#scp").textContent = scopeTxt();
      }
      addEventListener("resize", () => {
        if (T.i >= 0) tourShow();
      });
      let seen = 0;
      try {
        seen = localStorage.getItem("srag_tour");
      } catch {}
      if (!seen) setTimeout(tourStart, 900);
      chrome();
      paint();
      load().then(() =>
        api("/api/monitor/progress")
          .then((p) => p.running && trackAgent())
          .catch(() => {}),
      );
      setInterval(() => {
        if (!S.up) load();
      }, 15000);
    </script>
  </body>
</html>
